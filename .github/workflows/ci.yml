name: Python smoke and security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable and tests
        run: python -m pip install -e ".[test]"
      - name: SQLite smoke + security (PostgreSQL race remains unverified)
        run: python -m pytest -q
      - name: Generate synthetic evidence
        run: python -m pipeline_acceptance.demo --output proof-report.json
      - name: Validate report status
        shell: python
        run: |
          import json
          from pathlib import Path
          report = json.loads(Path("proof-report.json").read_text(encoding="utf-8"))
          assert report["pass"] and report["backend"] == "sqlite"
