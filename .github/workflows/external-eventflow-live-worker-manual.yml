name: External Eventflow live worker duplicate-dispatch (manual probe)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-worker-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ppa_eventflow_worker_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-eventflow-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ppa_eventflow_worker_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_DB: ppa_eventflow_worker_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: disposable-eventflow-only
      REDIS_URL: redis://127.0.0.1:6379/14
      DJANGO_SECRET_KEY: disposable-external-probe
      DJANGO_DEBUG: 'False'
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_TASK_ALWAYS_EAGER: 'False'
      EVENTFLOW_PROBE_DISPOSABLE: 'YES'
      EXPECTED_EVENTFLOW_SHA: c08455d626d5e1c316d932c4da0652086fb1b19e
    steps:
      - name: Checkout our experiment definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout pinned unmodified Eventflow demo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: juneja-varun/eventflow
          ref: c08455d626d5e1c316d932c4da0652086fb1b19e
          path: upstream-eventflow
          persist-credentials: false

      - name: Verify upstream revision and create artifact directory
        run: |
          set -euo pipefail
          mkdir -p worker-evidence
          test "$(git -C upstream-eventflow rev-parse HEAD)" = "$EXPECTED_EVENTFLOW_SHA"
          printf 'upstream=juneja-varun/eventflow\nsha=%s\nmode=manual_second_celery_dispatch\nupstream_source_modified=no\n' "$EXPECTED_EVENTFLOW_SHA" > worker-evidence/provenance.txt

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install upstream test dependencies
        run: python -m pip install -r upstream-eventflow/requirements-dev.txt

      - name: Create disposable PostgreSQL schema
        run: |
          set -euo pipefail
          cd upstream-eventflow
          python manage.py migrate --noinput

      - name: Launch actual independent Celery worker (not eager)
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-eventflow
          nohup celery -A config worker --pool=solo --concurrency=1 --loglevel=INFO </dev/null > ../worker-evidence/worker.log 2>&1 &
          echo "$!" > ../worker-evidence/worker.pid

      - name: Run fail-closed real broker proof
        id: probe
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE/upstream-eventflow"
          python experiments/eventflow_worker_probe/run_probe.py --output worker-evidence/report.json
          code=$?
          echo "probe_exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record evidence scope and local worker process status
        if: always()
        shell: bash
        run: |
          mkdir -p worker-evidence
          printf 'upstream_sha=%s\nprobe_exit=%s\n' "${EXPECTED_EVENTFLOW_SHA:-unknown}" "${{ steps.probe.outputs.probe_exit || 'NOT_RUN' }}" > worker-evidence/outcome.txt
          if test -f worker-evidence/worker.pid; then
            ps -p "$(cat worker-evidence/worker.pid)" -o pid=,args= >> worker-evidence/outcome.txt || true
          fi

      - name: Upload evidence even when inconclusive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eventflow-live-worker-manual-dispatch-evidence
          path: worker-evidence/
          if-no-files-found: error

      - name: Enforce expected reproducible RED
        if: always()
        shell: bash
        run: |
          test "${{ steps.probe.outputs.probe_exit || '2' }}" = '0'
