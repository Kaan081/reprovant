# Only disposable local PostgreSQL; never reconfigure to target an existing DB.
# Supply a unique random PIPELINE_DB_PASSWORD environment variable before running.
services:
  postgres:
    image: postgres:17-alpine
    init: true
    environment:
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: ${PIPELINE_DB_PASSWORD:?Generate and set a random local-only test password}
      POSTGRES_DB: acceptance
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceptance -d acceptance"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
