[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-pipeline-acceptance"
version = "0.2.1"
description = "A small evidence-first acceptance test experiment for Python worker + PostgreSQL failure modes"
requires-python = ">=3.10"
dependencies = ["SQLAlchemy>=2.0,<3.0"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
pipeline-acceptance = "pipeline_acceptance.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
